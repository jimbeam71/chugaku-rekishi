<title>中学歴史</title>
<style>
  /* layout: 目次(home) と 1話(lesson) を切り替える単一ページ。読みは最大640pxの一列。accent = 朱 */
  :root {
    --bg: #f6f1e9; --surface: #fffdf9; --surface-2: #f1eadd;
    --fg: #2c2a28; --muted: #6f675d; --line: #e5ddd0;
    --accent: #c2412b; --accent-ink: #9a3320; --accent-soft: #f8e8e1;
    --good: #2f7d57; --good-soft: #e4f1e9; --good-line: #bfe0cd;
    --wrong: #b23a3a; --wrong-soft: #f7e5e3; --wrong-line: #ecc9c6;
    --chip: #fbeee7; --radius: 14px; --maxw: 640px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1a1f; --surface: #26252b; --surface-2: #2f2d35;
      --fg: #ece7df; --muted: #a69f95; --line: #3a3842;
      --accent: #e8755c; --accent-ink: #f0947f; --accent-soft: #3a2822;
      --good: #6cc394; --good-soft: #22352b; --good-line: #345a44;
      --wrong: #e59090; --wrong-soft: #3a2626; --wrong-line: #5c3a3a;
      --chip: #332420; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1a1f; --surface: #26252b; --surface-2: #2f2d35;
    --fg: #ece7df; --muted: #a69f95; --line: #3a3842;
    --accent: #e8755c; --accent-ink: #f0947f; --accent-soft: #3a2822;
    --good: #6cc394; --good-soft: #22352b; --good-line: #345a44;
    --wrong: #e59090; --wrong-soft: #3a2626; --wrong-line: #5c3a3a;
    --chip: #332420; color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--fg); margin: 0;
    font-family: "Noto Sans JP", system-ui, sans-serif; font-weight: 400; line-height: 1.95; }
  .wrap { max-width: var(--maxw); margin: 0 auto; padding: 18px 18px 72px; }
  ruby rt { font-size: .58em; font-weight: 400; color: var(--muted); }
  h1, h2, .lesson-head, .q-head, .done-head, .secret-head, .home-h1, .block-era, .lc-ttl, .figcap, .done-head { font-family: "Zen Maru Gothic", "Noto Sans JP", sans-serif; }

  header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .brand { font-size: .78rem; font-weight: 700; letter-spacing: .06em; color: var(--accent-ink); cursor: pointer; background: none; border: none; font-family: inherit; padding: 0; }
  .theme-btn { font: inherit; font-size: .78rem; cursor: pointer; background: var(--surface); color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; }
  .theme-btn:hover { color: var(--fg); border-color: var(--accent); }

  /* ---------- 目次 ---------- */
  .home-h1 { font-size: 1.8rem; font-weight: 700; margin: 4px 0 4px; }
  .home-lead { color: var(--muted); font-size: .95rem; margin: 0 0 8px; }
  .home-note { font-size: .85rem; color: var(--muted); background: var(--surface-2); border-radius: 10px; padding: 11px 14px; margin: 14px 0 20px; }
  .home-note b { color: var(--fg); }

  .intro { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); margin: 0 0 28px; overflow: hidden; }
  .intro > summary { list-style: none; cursor: pointer; padding: 14px 16px; font-family: "Zen Maru Gothic", sans-serif; font-weight: 700; color: var(--accent-ink); display: flex; align-items: center; gap: 8px; }
  .intro > summary::-webkit-details-marker { display: none; }
  .intro > summary .chev { margin-left: auto; transition: transform .2s; font-size: .72rem; color: var(--muted); }
  .intro[open] > summary .chev { transform: rotate(180deg); }
  .intro-body { padding: 0 16px 18px; }
  .intro-body > p { margin: 0 0 12px; font-size: .92rem; }
  .intro-h { font-family: "Zen Maru Gothic", sans-serif; font-weight: 700; font-size: 1rem; margin: 20px 0 9px; }
  .steps { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; counter-reset: st; }
  .steps li { display: flex; gap: 10px; align-items: flex-start; font-size: .92rem; line-height: 1.7; }
  .steps li::before { counter-increment: st; content: counter(st); flex: none; width: 22px; height: 22px; border-radius: 7px; background: var(--chip); color: var(--accent-ink); border: 1.5px solid var(--accent); display: grid; place-items: center; font-size: .76rem; font-weight: 700; font-family: "Zen Maru Gothic", sans-serif; }
  .tips { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
  .tips li { font-size: .9rem; line-height: 1.7; background: var(--surface-2); border-radius: 9px; padding: 9px 12px; }
  .tips li b { color: var(--accent-ink); }
  .goro { background: var(--accent-soft); border-radius: 10px; padding: 14px; }
  .goro .big { font-family: "Zen Maru Gothic", sans-serif; font-weight: 700; font-size: 1.32rem; color: var(--accent-ink); letter-spacing: .04em; text-align: center; margin: 0 0 12px; }
  .goro-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .goro-list li { display: flex; align-items: center; gap: 9px; font-size: .92rem; background: var(--surface); border-radius: 8px; padding: 6px 10px; }
  .goro-list .kana { flex: none; width: 24px; height: 24px; border-radius: 6px; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: .85rem; font-family: "Zen Maru Gothic", sans-serif; }
  .goro .sub { font-size: .78rem; color: var(--muted); margin: 10px 0 0; }
  .flow { font-size: .86rem; line-height: 2; background: var(--surface-2); border-radius: 9px; padding: 11px 13px; margin: 0; }
  .block { margin-bottom: 24px; }
  .block-era { display: flex; align-items: baseline; gap: 10px; font-size: 1.12rem; font-weight: 700; margin: 0 0 10px; }
  .block-era .w { font-size: .72rem; font-weight: 700; color: var(--accent-ink); background: var(--accent-soft); border-radius: 999px; padding: 2px 9px; }
  .lc-grid { display: grid; gap: 9px; }
  .lc { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; font: inherit;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; cursor: pointer; color: var(--fg); }
  .lc.ready:hover { border-color: var(--accent); }
  .lc.soon { opacity: .5; cursor: default; }
  .lc-no { flex: none; width: 30px; height: 30px; border-radius: 9px; background: var(--surface-2); color: var(--accent-ink);
    display: grid; place-items: center; font-size: .82rem; font-weight: 700; font-family: "Zen Maru Gothic", sans-serif; }
  .lc.ready .lc-no { background: var(--accent); color: #fff; }
  .lc-ttl { font-weight: 700; font-size: 1rem; }
  .lc-tag { margin-left: auto; flex: none; font-size: .72rem; color: var(--muted); }
  .lc.ready .lc-tag { color: var(--accent-ink); font-weight: 700; }

  /* ---------- 1話 ---------- */
  .crumbs { font-size: .76rem; font-weight: 700; color: var(--accent-ink); margin-bottom: 2px; }
  .crumbs .sep { color: var(--line); margin: 0 .5em; }
  h1 { font-size: 1.68rem; font-weight: 700; line-height: 1.35; margin: 2px 0 6px; text-wrap: balance; }
  .subhead { color: var(--muted); font-size: .9rem; margin: 0 0 26px; }

  .frame { background: var(--accent-soft); border-radius: var(--radius); padding: 18px; margin-bottom: 30px; }
  .frame-tag { display: inline-flex; align-items: center; gap: 6px; font-size: .8rem; font-weight: 700; color: var(--accent-ink); margin-bottom: 8px; font-family: "Zen Maru Gothic", sans-serif; }
  .frame-tag .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
  .frame p { margin: 0; } .frame p + p { margin-top: 10px; }
  .read3 { margin: 13px 0 0 !important; font-size: .82rem; font-weight: 700; color: var(--accent-ink); }

  .lesson-head, .q-head { display: flex; align-items: center; gap: 10px; font-size: 1.2rem; font-weight: 700; margin: 0 0 4px; }
  .num-badge { flex: none; width: 30px; height: 30px; border-radius: 9px; background: var(--accent); color: #fff;
    display: grid; place-items: center; font-size: .82rem; font-weight: 700; font-family: "Zen Maru Gothic", sans-serif; }
  :root[data-theme="dark"] .num-badge, :root:not([data-theme="light"]) .num-badge,
  :root[data-theme="dark"] .goro-list .kana, :root:not([data-theme="light"]) .goro-list .kana,
  :root[data-theme="dark"] .ondoku-btn, :root:not([data-theme="light"]) .ondoku-btn { color: #1b1a1f; }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) .num-badge, :root:not([data-theme="dark"]) .goro-list .kana, :root:not([data-theme="dark"]) .ondoku-btn { color: #fff; } }
  .sec-note { color: var(--muted); font-size: .88rem; margin: 0 0 16px 40px; }

  .goals { display: grid; gap: 10px; margin: 0 0 30px; }
  .goal { display: flex; gap: 12px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 13px 15px; }
  .goal .ic { flex: none; font-size: 1.1rem; }
  .goal .k { font-weight: 700; color: var(--accent-ink); font-size: 1.02rem; }
  .goal .d { color: var(--muted); font-size: .9rem; display: block; margin-top: 2px; line-height: 1.7; }

  .read { margin-bottom: 26px; } .read p { margin: 0 0 16px; }
  .term { font-weight: 700; color: var(--accent-ink); background: var(--chip); border-radius: 5px; padding: 0 3px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }

  .figure { margin: 0 0 26px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
  .figure svg, .figure img { display: block; width: 100%; height: auto; max-width: 460px; margin: 0 auto; }
  .figure img { border-radius: 8px; }
  figure.figure { margin: 0 0 26px; }
  .figcap { text-align: center; font-size: .85rem; color: var(--muted); margin-top: 8px; }
  .figcap .cred { display: block; font-size: .72rem; opacity: .7; margin-top: 2px; }
  .annowrap { position: relative; max-width: 460px; margin: 0 auto; }
  .annowrap img { display: block; width: 100%; height: auto; border-radius: 8px; }
  .anno-mark { position: absolute; transform: translate(-50%, -50%); width: 27px; height: 27px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: .82rem; font-family: "Zen Maru Gothic", sans-serif; border: 2px solid #fff; box-shadow: 0 0 0 2px var(--accent); }
  .zukai { margin: 0 0 26px; border: 2px solid var(--accent); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
  .zukai-h { display: flex; align-items: center; gap: 8px; font-family: "Zen Maru Gothic", sans-serif; font-weight: 700; font-size: 1rem; color: #fff; background: var(--accent); padding: 9px 14px; }
  .zukai-h .tag { margin-left: auto; font-size: .72rem; background: rgba(255,255,255,.22); border-radius: 999px; padding: 2px 10px; }
  :root[data-theme="dark"] .zukai-h, :root:not([data-theme="light"]) .zukai-h { color: #1b1a1f; }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) .zukai-h { color: #fff; } }
  .zukai img { display: block; width: 100%; height: auto; }
  .zukai-cap { font-size: .82rem; color: var(--muted); padding: 9px 14px; }
  .zukai-cap .cred { display: block; font-size: .72rem; opacity: .7; margin-top: 2px; }
  .photo-slot { display: flex; gap: 12px; align-items: flex-start; border: 1.5px dashed var(--accent); border-radius: var(--radius); background: var(--accent-soft); padding: 13px 15px; margin: 0 0 12px; }
  .photo-slot .pic { flex: none; font-size: 1.3rem; }
  .photo-slot .pt { font-weight: 700; color: var(--accent-ink); font-size: .95rem; }
  .photo-slot .pk { display: block; margin-top: 3px; font-size: .82rem; color: var(--muted); }
  .photo-slot .pk code { background: var(--surface); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; font-size: .92em; }

  .progress { display: flex; align-items: center; gap: 10px; margin: 0 0 18px 40px; color: var(--muted); font-size: .88rem; }
  .bar { flex: 1; height: 7px; background: var(--surface-2); border-radius: 999px; overflow: hidden; max-width: 200px; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--good); border-radius: 999px; transition: width .4s ease; }
  .count { font-weight: 700; color: var(--fg); font-variant-numeric: tabular-nums; }

  .q-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 16px 15px; margin-bottom: 14px; }
  .q-card .ask { font-weight: 700; font-size: 1.02rem; margin: 0 0 13px; }
  .q-card .ask .qn { color: var(--accent-ink); margin-right: 6px; }
  .opts { display: grid; gap: 9px; }
  .opt { font: inherit; text-align: left; cursor: pointer; background: var(--bg); color: var(--fg); border: 1.5px solid var(--line); border-radius: 10px;
    padding: 11px 15px; line-height: 1.6; display: flex; align-items: center; gap: 10px; transition: border-color .15s, background .15s; }
  .opt:hover:not(:disabled) { border-color: var(--accent); }
  .opt:disabled { cursor: default; }
  .opt .mk { flex: none; font-weight: 700; width: 1.3em; text-align: center; opacity: .5; font-size: .9rem; }
  .opt.correct { border-color: var(--good-line); background: var(--good-soft); } .opt.correct .mk { opacity: 1; color: var(--good); }
  .opt.wrong { border-color: var(--wrong-line); background: var(--wrong-soft); } .opt.wrong .mk { opacity: 1; color: var(--wrong); }
  .opt.dim { opacity: .5; }
  .explain { margin-top: 13px; padding: 13px 14px; border-radius: 10px; background: var(--surface-2); font-size: .92rem; line-height: 1.8; }
  .explain .verdict { font-weight: 700; font-family: "Zen Maru Gothic", sans-serif; }
  .explain.ok .verdict { color: var(--good); } .explain.ng .verdict { color: var(--wrong); }
  .explain p { margin: 6px 0 0; }
  .ex-src { display: none; }

  .done { margin-top: 30px; background: var(--accent-soft); border-radius: var(--radius); padding: 22px 20px; text-align: center; opacity: .5; transition: opacity .4s; }
  .done.on { opacity: 1; }
  .done-head { font-size: 1.3rem; font-weight: 700; margin: 0 0 4px; }
  .done .score { font-size: 2rem; font-weight: 700; font-family: "Zen Maru Gothic", sans-serif; color: var(--accent); display: block; margin: 4px 0; }
  .done p { margin: 0; color: var(--accent-ink); font-size: .95rem; }

  .secret { margin-top: 16px; background: var(--surface); border: 1.5px solid var(--accent); border-radius: var(--radius); padding: 20px 18px; opacity: .55; transition: opacity .45s; }
  .secret.on { opacity: 1; }
  .secret-head { display: flex; align-items: center; gap: 8px; font-size: 1.14rem; font-weight: 700; color: var(--accent-ink); margin: 0 0 4px; }
  .secret-lead { margin: 0 0 18px; font-size: .9rem; color: var(--muted); }
  .secret-item { display: flex; gap: 12px; margin-bottom: 18px; }
  .si-no { flex: none; align-self: flex-start; white-space: nowrap; font-family: "Zen Maru Gothic", sans-serif; font-weight: 700; font-size: .8rem; color: var(--accent-ink); border: 1.5px solid var(--accent); border-radius: 999px; padding: 3px 11px; }
  .si-body { min-width: 0; } .si-body p { margin: 0 0 8px; font-size: .95rem; }
  .si-ttl { font-weight: 700; font-size: 1.04rem; font-family: "Zen Maru Gothic", sans-serif; }
  .si-body .si-point { background: var(--chip); border-radius: 9px; padding: 9px 12px; font-size: .88rem; margin: 4px 0 0; }
  .secret-foot { margin: 2px 0 0; text-align: center; font-weight: 700; font-family: "Zen Maru Gothic", sans-serif; color: var(--accent-ink); font-size: .95rem; }

  .nav-row { display: flex; gap: 10px; align-items: center; justify-content: space-between; margin-top: 24px; }
  .nav-btn { font: inherit; font-weight: 700; cursor: pointer; border-radius: 999px; padding: 9px 16px; border: 1.5px solid var(--line); background: var(--surface); color: var(--fg); font-family: "Zen Maru Gothic", sans-serif; font-size: .9rem; }
  .nav-btn:hover:not(:disabled) { border-color: var(--accent); }
  .nav-btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .nav-btn:disabled { opacity: .4; cursor: default; }
  .nav-btn.toc { border: none; background: none; color: var(--accent-ink); }

  .meter { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin: 0 0 20px; }
  .meter-h { font-family: "Zen Maru Gothic", sans-serif; font-weight: 700; color: var(--accent-ink); margin-bottom: 12px; }
  .meter-row { display: flex; gap: 12px; margin-bottom: 12px; }
  .meter-stat { flex: 1; background: var(--surface-2); border-radius: 10px; padding: 10px 12px; text-align: center; }
  .meter-stat .num { display: block; font-family: "Zen Maru Gothic", sans-serif; font-weight: 700; font-size: 1.5rem; color: var(--accent); font-variant-numeric: tabular-nums; }
  .meter-stat .lbl { display: block; font-size: .76rem; color: var(--muted); margin-top: 2px; }
  .meter-bar { height: 9px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
  .meter-bar > i { display: block; height: 100%; background: var(--good); border-radius: 999px; transition: width .5s; }
  .meter-msg { margin: 10px 0 0; font-size: .88rem; font-weight: 700; color: var(--accent-ink); text-align: center; }
  .special-lc { margin-bottom: 26px; }
  .lc.cleared .lc-no { background: var(--good); color: #fff; }
  .lc.cleared .lc-tag { color: var(--good); }
  .ondoku { margin-top: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 13px; }
  .ondoku-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 9px; }
  .ondoku-lbl { font-family: "Zen Maru Gothic", sans-serif; font-weight: 700; font-size: .9rem; color: var(--accent-ink); }
  .ondoku-sub { font-weight: 400; font-size: .74rem; color: var(--muted); margin-left: 5px; }
  .ondoku-count { font-family: "Zen Maru Gothic", sans-serif; font-weight: 700; font-variant-numeric: tabular-nums; }
  .ondoku-dots { display: flex; gap: 7px; margin-bottom: 10px; }
  .ondoku-dots .d { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); background: var(--bg); transition: background .15s, border-color .15s; }
  .ondoku-dots .d.on { background: var(--accent); border-color: var(--accent); }
  .ondoku-actions { display: flex; gap: 12px; align-items: center; }
  .ondoku-btn { font: inherit; font-weight: 700; font-family: "Zen Maru Gothic", sans-serif; cursor: pointer; background: var(--accent); color: #fff; border: none; border-radius: 999px; padding: 7px 16px; font-size: .88rem; }
  .ondoku-btn:disabled { opacity: .45; cursor: default; }
  .ondoku-reset { font: inherit; cursor: pointer; background: none; border: none; color: var(--muted); font-size: .8rem; text-decoration: underline; padding: 0; }
  .ondoku-praise { margin: 9px 0 0; font-size: .85rem; font-weight: 700; color: var(--good); }
  .ylist { list-style: none; margin: 0 0 4px; padding: 0; display: grid; gap: 8px; }
  .ylist li { display: flex; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 13px; }
  .yr { flex: none; font-family: "Zen Maru Gothic", sans-serif; font-weight: 700; color: var(--accent-ink); font-size: 1.02rem; min-width: 3.4em; font-variant-numeric: tabular-nums; }
  .ye { font-weight: 700; font-size: .95rem; display: block; }
  .yg { display: block; font-size: .85rem; color: var(--muted); margin-top: 1px; }
  .special-grid { display: grid; gap: 9px; margin-bottom: 26px; }
  .myth-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 15px 16px; margin-bottom: 12px; }
  .myth { margin: 0 0 7px; font-size: .95rem; color: var(--muted); display: flex; gap: 8px; }
  .myth .x { flex: none; color: var(--wrong); font-weight: 700; }
  .truth { margin: 0 0 8px; font-size: 1.02rem; font-weight: 700; display: flex; gap: 8px; }

      body: '<p>秀吉が亡くなると、天下をねらう大名たちが2つに分かれて対立しました。そして<b>1600年</b>、<span class="term"><ruby>関ヶ原<rt>せきがはら</rt></ruby>の戦い</span>（岐阜県）が起こります。<ruby>徳川家康<rt>とくがわいえやす</rt></ruby>が率いる<b>東軍</b>と、<ruby>石田三成<rt>いしだみつなり</rt></ruby>を中心とする<b>西軍</b>の、全国の大名を二分した「天下分け目の戦い」です。これに勝った家康が、天下の実権をにぎりました。</p>'
        + '<p><b>1603年</b>、家康は朝廷から<span class="term"><ruby>征夷大将軍<rt>せいいたいしょうぐん</rt></ruby></span>に任命され、<ruby>江戸<rt>えど</rt></ruby>（今の東京）に<span class="term"><ruby>江戸幕府<rt>えどばくふ</rt></ruby></span>を開きました。これが、約260年続く江戸時代の始まりです。家康は将軍の位をすぐに息子にゆずり、「<b>徳川家が代々将軍になる</b>」と全国に示しました。そして1615年、<ruby>大阪<rt>おおさか</rt></ruby>の陣で豊臣氏をほろぼし、徳川の世を確かなものにします。</p>'
        + '<p>江戸幕府の支配のしくみを<span class="term"><ruby>幕藩体制<rt>ばくはんたいせい</rt></ruby></span>といいます。全国の土地は、幕府の直接の領地と、<ruby>大名<rt>だいみょう</rt></ruby>が治める<span class="term"><ruby>藩<rt>はん</rt></ruby></span>に分けられました。幕府は大名を3種類に分けて配置します。徳川家の親せきの<span class="term"><ruby>親藩<rt>しんぱん</rt></ruby></span>、古くからの家臣の<span class="term"><ruby>譜代<rt>ふだい</rt></ruby>大名</span>、関ヶ原のころに従った<span class="term"><ruby>外様<rt>とざま</rt></ruby>大名</span>です。信頼の薄い外様は、江戸から遠い場所に置きました。</p>'
        + '<p>大名を厳しく管理するため、幕府は<span class="term"><ruby>武家諸法度<rt>ぶけしょはっと</rt></ruby></span>という大名向けのきまりを定めました。これにそむいた大名は、領地を取り上げられることもありました。3代将軍<span class="term"><ruby>徳川家光<rt>とくがわいえみつ</rt></ruby></span>は、1635年にこの法を改め、<span class="term"><ruby>参勤交代<rt>さんきんこうたい</rt></ruby></span>を制度にしました。大名は<b>1年おきに江戸と自分の領地を往復</b>し、妻子は人質として江戸に住まわせる決まりです。行列の費用は大名の大きな負担となり、幕府に反抗する力をそぐ効果がありました。</p>',

      questions: [
        { ask: '1600年、徳川家康が石田三成を破った「天下分け目」の戦いは?', opts: [{ t: '関ヶ原の戦い', ok: true }, { t: '長篠の戦い', ok: false }, { t: '桶狭間の戦い', ok: false }], vo: 'そう、これ!', vn: 'おしい、ちがうよ', why: '天下分け目＝<b>関ヶ原の戦い</b>（1600年・岐阜県）。長篠の戦いは信長が鉄砲で武田軍を破った戦い、桶狭間の戦いは信長が今川義元を破った戦いで、どちらも信長の時代の別の戦いです。' },

        { ask: '大名を1年おきに江戸と領地の間を往復させた制度は?', opts: [{ t: '参勤交代', ok: true }, { t: '刀狩', ok: false }, { t: '楽市・楽座', ok: false }], vo: 'おぼえてたね!', vn: 'ここでふり返ろう', why: '1年おきの往復＝<b>参勤交代</b>。刀狩は秀吉が農民から武器を取り上げた政策、楽市・楽座は信長の商業政策で、どちらも大名を往復させる制度ではありません。' },
        { ask: '参勤交代を1635年に制度として定めた、江戸幕府の3代将軍はだれ?', opts: [{ t: '徳川家光', ok: true }, { t: '徳川家康', ok: false }, { t: '豊臣秀吉', ok: false }], vo: '完ぺき!', vn: 'ラスト、ここだけ', why: '参勤交代を制度化した＝3代将軍<b>徳川家光</b>（1635年）。徳川家康は幕府を開いた初代将軍、豊臣秀吉は江戸幕府より前に全国統一した人で、どちらも参勤交代を定めた将軍ではありません。' },

      secrets: [
        { no: '其の一', ttl: '家康の口ぐせは「がまん」だった', body: '徳川家康は、信長・秀吉という2人の天下人に長いあいだ従い、<b>じっとチャンスを待ち続けた</b>人です。信長には同盟相手として、秀吉には家来としてがまんを重ね、2人が亡くなったあと、ついに自分の番をつかみました。「<ruby>鳴<rt>な</rt></ruby>かぬなら鳴くまで待とうホトトギス」という句は、この家康の性格を表したものとして有名です。', point: '信長＝「鳴かぬなら殺してしまえ」、秀吉＝「鳴かせてみせよう」、家康＝「鳴くまで待とう」。3人の性格の違いがこの句で一発でわかる。' },
        { no: '其の二', ttl: '「江戸」は、もともと何もない田舎だった', body: '家康が本拠に選んだ江戸は、当時は海ぞいの<b>湿地ばかりの小さな土地</b>でした。家康は川の流れを変え、海をうめ立て、ゼロから巨大な城下町を作り上げます。やがて江戸は人口100万人をこえ、<b>当時世界でも最大級の都市</b>に成長しました。今の東京の原型です。', point: '「えらい人がいた都だから栄えた」のではなく「何もない所をイチから作った」。だから東京は、日本の歴史の都市の中では“新しい”街。' }

      body: '<p>家康の時代、幕府は最初こそ貿易の利益を重視していました。しかし、<span class="term">キリスト教</span>の信者が増えると、「神への信仰で団結した人々が、幕府に従わなくなるのでは」と警戒を強めます。そこで幕府はキリスト教を禁止し、信者を見つけるために、キリストやマリアの絵をふませる<span class="term"><ruby>絵踏<rt>えふみ</rt></ruby></span>を行いました。</p>'

        + '<p>ただし「鎖国」といっても、日本が世界から<b>完全に閉じたわけではありません</b>。実際には<b>4つの窓口</b>が開いていました。<span class="term"><ruby>長崎<rt>ながさき</rt></ruby></span>では幕府がオランダ・中国と貿易し、<ruby>対馬<rt>つしま</rt></ruby>（長崎県）藩は<b>朝鮮</b>と、<ruby>薩摩<rt>さつま</rt></ruby>（鹿児島県）藩は<b>琉球</b>（今の沖縄）と、<ruby>松前<rt>まつまえ</rt></ruby>（北海道）藩は<ruby>蝦夷地<rt>えぞち</rt></ruby>の<b>アイヌ</b>と交易を続けたのです。朝鮮からは、将軍の代がわりごとに<ruby>朝鮮通信使<rt>ちょうせんつうしんし</rt></ruby>という使節もやって来ました。「完全な孤立」ではなく、<b>窓口をしぼって管理した</b>——これが鎖国の正体です。</p>',

        { ask: '鎖国中も貿易が続いた「4つの窓口」に、あてはまらないのはどれ?', opts: [{ t: '京都（ヨーロッパ各国と貿易）', ok: true }, { t: '対馬（朝鮮と交易）', ok: false }, { t: '薩摩（琉球と交易）', ok: false }], vo: '完ぺき!', vn: 'ラスト、ここだけ', why: '4つの窓口は<b>長崎・対馬・薩摩・松前</b>。京都は窓口ではありません。対馬は朝鮮、薩摩は琉球、松前はアイヌとの窓口で、長崎（オランダ・中国）と合わせて4つです。' },

      body: '<p>平和が続いた江戸時代は、産業と経済が大きく発達しました。農業では<ruby>新田<rt>しんでん</rt></ruby>開発や新しい農具で生産が増え、各地で特産品が作られます。それらを全国に運ぶため、交通も整いました。とくに陸路では、江戸の<ruby>日本橋<rt>にほんばし</rt></ruby>（東京都）を起点とする<span class="term"><ruby>五街道<rt>ごかいどう</rt></ruby></span>（東海道・中山道など5つの幹線道路）が整備され、海路では大阪と江戸を結ぶ航路が開かれました。</p>'
        + '<p>こうして全国にモノとお金が回り、大きな都市が栄えます。とくに重要な3つの都市を<span class="term">三都</span>といいます。政治の中心で「将軍のおひざもと」の<ruby>江戸<rt>えど</rt></ruby>、全国の米や特産品が集まり「<span class="term"><ruby>天下の台所<rt>てんかのだいどころ</rt></ruby></span>」と呼ばれた商業の中心<ruby>大阪<rt>おおさか</rt></ruby>、古くからの文化と手工業の都<ruby>京都<rt>きょうと</rt></ruby>です。商人たちは<ruby>株仲間<rt>かぶなかま</rt></ruby>という同業者の組合をつくり、大きな利益を上げました。</p>'

        + '<p>いっぽう江戸時代<b>後期</b>（19世紀初めごろ）、こんどは<b>江戸</b>の町人を中心に栄えたのが<span class="term"><ruby>化政<rt>かせい</rt></ruby>文化</span>です。しゃれ・こっけい・風刺のきいた、より庶民的な文化で、こっけい本の<ruby>十返舎一九<rt>じっぺんしゃいっく</rt></ruby>、俳句の<ruby>小林一茶<rt>こばやしいっさ</rt></ruby>らが人気を集めました。絵では、多色刷りの版画<span class="term"><ruby>錦絵<rt>にしきえ</rt></ruby></span>が大流行し、<ruby>葛飾北斎<rt>かつしかほくさい</rt></ruby>の「富嶽三十六景」や<ruby>歌川広重<rt>うたがわひろしげ</rt></ruby>の「東海道五十三次」などの風景画が生まれました。これらはのちに、海外の画家にも大きな影響を与えます。</p>',

      frame: '<p>会社が長く続くと、だんだん<b>お金が足りなくなる</b>ことがあります。出ていくお金（支出）は増えるのに、入ってくるお金（収入＝年貢）は増えない——。</p>'
        + '<p>そこで歴代の“立て直しリーダー”が、次々と<b>節約（質素倹約）</b>を軸にした改革に挑みました。でも、どれもなかなかうまくいかない。江戸幕府が少しずつ行きづまっていく、その流れを見ていきます。覚えるコツは「<b>誰が・いつ・何をして・どうなったか</b>」をセットにすることです。</p>',

      body: '<p>平和が続くいっぽうで、幕府の財政は少しずつ苦しくなっていきました。参勤交代の費用や、たびたびのききん・災害で支出がかさむのに、収入の中心である年貢は大きく増えなかったからです。そこで歴代のリーダーが、立て直しの改革に取り組みます。</p>'

        + '<p>次に力をもったのが老中<span class="term"><ruby>田沼意次<rt>たぬまおきつぐ</rt></ruby></span>（18世紀後半）。彼だけは、倹約ではなく<b>商業の力</b>で財政を立て直そうとしました。商人の同業組合<ruby>株仲間<rt>かぶなかま</rt></ruby>を積極的に認め、営業税を取るなどの政策です。経済は活気づきましたが、<b>わいろ（賄賂）</b>が横行して批判が高まり、ききんも重なって失脚しました。</p>'

      body: '<p>開国後の混乱の中、幕府をたおそうとする勢力の中心になったのが、<ruby>薩摩<rt>さつま</rt></ruby>藩（鹿児島県）と<ruby>長州<rt>ちょうしゅう</rt></ruby>藩（山口県）です。もともと対立していた両藩は、<ruby>坂本龍馬<rt>さかもとりょうま</rt></ruby>らの仲立ちで<ruby>薩長同盟<rt>さっちょうどうめい</rt></ruby>を結び、倒幕へと動きます。これを受けて1867年、15代将軍<span class="term"><ruby>徳川慶喜<rt>とくがわよしのぶ</rt></ruby></span>は、自ら政権を朝廷（天皇）に返しました。これが<span class="term"><ruby>大政奉還<rt>たいせいほうかん</rt></ruby></span>で、約260年続いた江戸幕府が終わります。</p>'

        + '<p>1868年、新政府は政治の基本方針として<span class="term"><ruby>五箇条<rt>ごかじょう</rt></ruby>の<ruby>御誓文<rt>ごせいもん</rt></ruby></span>を、明治天皇が神々に誓う形で発表しました。「広く会議を開いてみんなの意見で決めよう」「世界から新しい知識を学ぼう」といった内容です。同じ年、年号は<ruby>明治<rt>めいじ</rt></ruby>と改められ、都も京都から<ruby>東京<rt>とうきょう</rt></ruby>へ移されました。</p>'
        + '<p>新政府が急いだのは、ばらばらだった国を<b>一つにまとめること（中央集権）</b>です。まず1869年、各藩に土地と人民を天皇に返させる<span class="term"><ruby>版籍奉還<rt>はんせきほうかん</rt></ruby></span>を行い、さらに1871年、藩そのものを廃止して全国に県を置く<span class="term"><ruby>廃藩置県<rt>はいはんちけん</rt></ruby></span>を断行しました。これで、政府が全国を直接治めるしくみが完成します。また、江戸時代の身分の区別をあらため、<span class="term"><ruby>四民平等<rt>しみんびょうどう</rt></ruby></span>として、名字をもつことや職業・住む場所を自由に選べるようにしました（ただし、もとの身分による差別はその後も残りました）。こうした一連の大改革が、明治維新です。実際にこれを動かしたのは、薩摩の<ruby>西郷隆盛<rt>さいごうたかもり</rt></ruby>・<ruby>大久保利通<rt>おおくぼとしみち</rt></ruby>、長州の<ruby>木戸孝允<rt>きどたかよし</rt></ruby>ら、もとは身分の低い武士たちでした。</p>',

        { ask: '倒幕の中心となり、明治維新を動かした2つの藩はどこ?', opts: [{ t: '薩摩藩と長州藩', ok: true }, { t: '会津藩と水戸藩', ok: false }, { t: '尾張藩と紀州藩', ok: false }], vo: '完ぺき!', vn: 'ラスト、ここだけ', why: '倒幕の中心＝<b>薩摩藩（鹿児島県）と長州藩（山口県）</b>。両藩は薩長同盟を結んで倒幕を進めました。会津藩は旧幕府側、尾張・紀州は徳川の親藩で、倒幕の中心ではありません。' },

      body: '<p>欧米に追いつくため、明治政府は「<span class="term"><ruby>富国強兵<rt>ふこくきょうへい</rt></ruby></span>」（国を豊かにし、軍隊を強くする）を目標にかかげました。その柱となったのが、教育・軍事・税をめぐる3つの大きな改革です。</p>'
        + '<p>1つ目が、1872年の<span class="term"><ruby>学制<rt>がくせい</rt></ruby></span>。満6歳以上のすべての子どもに小学校教育を受けさせる、と定めました（国民皆学）。2つ目が、1873年の<span class="term"><ruby>徴兵令<rt>ちょうへいれい</rt></ruby></span>。満20歳以上の男子に、3年間の兵役（軍隊に入る義務）を課しました。これで、武士だけでなく国民からなる近代的な軍隊がつくられます。3つ目が、同じ1873年の<span class="term"><ruby>地租改正<rt>ちそかいせい</rt></ruby></span>です。それまで米で納めていた税を、<b>現金（お金）</b>で納めるように変え、税額は<b>土地の値段（地価）の3%</b>、納めるのは<b>土地の所有者</b>と定めました。これにより、米のとれ高やねだんに左右されず、政府の収入が安定したのです。</p>'
        + '<p>いっぽう、産業を育てるための<span class="term"><ruby>殖産興業<rt>しょくさんこうぎょう</rt></ruby></span>も進められました。政府はお手本となる官営の工場をつくり、外国から機械や技術者を招きます。その代表が、群馬県の<span class="term"><ruby>富岡製糸場<rt>とみおかせいしじょう</rt></ruby></span>（1872年）。フランスの技術で生糸を生産し、輸出で国をうるおしました。鉄道も開通し、1872年には新橋（東京都）〜横浜（神奈川県）の間を蒸気機関車が走ります。</p>'
        + '<p>こうした動きの中で、人々のくらしも西洋風に大きく変わりました。これを<span class="term"><ruby>文明開化<rt>ぶんめいかいか</rt></ruby></span>といいます。都市にはガス灯やれんが造りの建物が並び、洋服を着て、ちょんまげを切る（<ruby>断髪<rt>だんぱつ</rt></ruby>）人が増えました。こよみも、月の動きをもとにした旧暦から、西洋式の<ruby>太陽暦<rt>たいようれき</rt></ruby>に変わります。また、<ruby>福沢諭吉<rt>ふくざわゆきち</rt></ruby>が『<ruby>学問<rt>がくもん</rt></ruby>のすゝめ』を著して、「人はみな平等で、学ぶことが大切だ」と説き、新しい時代の考え方を広めました。</p>',

        + '<p>こうした流れの中、1925年に<span class="term"><ruby>普通選挙法<rt>ふつうせんきょほう</rt></ruby></span>が成立しました。それまで選挙権は高い税金を納める人だけに限られていましたが、この法律で<b>満25歳以上のすべての男子</b>に選挙権があたえられ、納税の条件がなくなりました。ただし、<b>女性にはまだ選挙権はありません</b>でした。また同じ1925年には、社会のしくみを変えようとする動きを取りしまる<span class="term"><ruby>治安維持法<rt>ちあんいじほう</rt></ruby></span>も成立します。民主主義が広がるいっぽうで、それをおさえる法律も同時につくられた——大正という時代の、二つの顔でした。</p>',

      secrets: [
        { no: '其の一', ttl: '新渡戸稲造も、お札の“顔”だった', body: '国際連盟で活やくした新渡戸稲造は、英語で『<ruby>武士道<rt>ぶしどう</rt></ruby>』を書き、日本の心を世界に紹介した国際人です。かつての<b>5000円札</b>の顔でもありました。「世界と日本の“かけ橋”になる」ことを生涯のテーマにした人です。', point: '福沢諭吉（1万円）・板垣退助（100円）に続き、新渡戸稲造（5千円）も“お札の偉人”。歴史の人物は、意外と身近にいる。' },

    {

      frame: '<p>世界中の経済が一気に落ちこみ、どの国もくらしに苦しんだとき（世界恐慌）、国が選んだ「出口」が、他国への進出や軍事力の拡大だったら——? 一歩ずつの選択が積み重なり、やがて世界をまきこむ大きな戦争へと進んでいきました。</p>'
        + '<p>この回は、日本が戦争へと向かい、多くの命が失われ、敗戦をむかえるまでの流れを見ます。重く、つらい内容ですが、<b>「なぜ戦争は起きたのか」「どう終わったのか」</b>を知ることは、同じことをくり返さないためにいちばん大切な学びです。落ち着いて、事実を追っていきましょう。</p>',

      ],
      body: '<p>1929年、アメリカから始まった不景気が世界中に広がりました。これを<span class="term"><ruby>世界恐慌<rt>せかいきょうこう</rt></ruby></span>といいます。多くの国が深刻な不況におちいり、日本も生糸などの輸出が激減して苦しみました。そんな中、日本は資源や市場を求めて中国への進出を強めます。1931年、日本の軍が中国の東北部（満州）で軍事行動を起こし、翌年には満州国という国をつくって支配しました。これを<span class="term"><ruby>満州事変<rt>まんしゅうじへん</rt></ruby></span>といいます。これを認めない<ruby>国際連盟<rt>こくさいれんめい</rt></ruby>と対立した日本は、1933年、<b>国際連盟を脱退</b>し、世界の中で孤立していきました。</p>'
        + '<p>そして1937年、日本と中国の間でついに全面的な戦争＝<span class="term"><ruby>日中戦争<rt>にっちゅうせんそう</rt></ruby></span>が始まります。戦争は長引き、国内では、人も物も戦争のために総動員されるようになりました（<ruby>国家総動員法<rt>こっかそうどういんほう</rt></ruby>）。生活品は配給制になり、国民のくらしは大きく制限されていきます。やがて日本は、同じく勢力を広げようとしていたドイツ・イタリアと<ruby>日独伊三国同盟<rt>にちどくいさんごくどうめい</rt></ruby>を結びました。</p>'
        + '<p>1939年、ヨーロッパでは<span class="term"><ruby>第二次世界大戦<rt>だいにじせかいたいせん</rt></ruby></span>が始まっていました。そして1941年12月、日本はアメリカ・イギリスなどと開戦します。これが<span class="term"><ruby>太平洋戦争<rt>たいへいようせんそう</rt></ruby></span>です。はじめは勢いがありましたが、しだいにアメリカにおされ、戦況は悪化していきました。戦争が長引くと、都市は空襲で焼かれ、多くの民間人が犠牲になります。中学生や女学生も工場などで働かされ（<ruby>勤労動員<rt>きんろうどういん</rt></ruby>）、都市の子どもたちは地方へ避難しました（<ruby>集団疎開<rt>しゅうだんそかい</rt></ruby>）。</p>'
        + '<p>1945年に入ると、被害はさらに深刻になります。3月の<ruby>東京大空襲<rt>とうきょうだいくうしゅう</rt></ruby>で東京の多くが焼け、4月からの<ruby>沖縄戦<rt>おきなわせん</rt></ruby>（沖縄県）では、住民をまきこむ地上戦で多くの命が失われました。そして8月6日に<span class="term"><ruby>広島<rt>ひろしま</rt></ruby></span>（広島県）、8月9日に<span class="term"><ruby>長崎<rt>ながさき</rt></ruby></span>（長崎県）へ、アメリカが<span class="term"><ruby>原子爆弾<rt>げんしばくだん</rt></ruby>（原爆）</span>を投下。一瞬で何万もの命がうばわれ、生き残った人も長く後遺症に苦しみました。ソ連も参戦する中、日本は<span class="term"><ruby>ポツダム宣言<rt>ぽつだむせんげん</rt></ruby></span>（連合国が出した降伏の勧告）を受け入れ、<b>1945年8月15日</b>、昭和天皇のラジオ放送で、国民に戦争の終わり（敗戦）が伝えられました。こうして、長く続いた戦争がようやく終わったのです。',
      svg: null, svgCap: '',
      photos: [{ src: 'img/genbaku_dome.png', cap: '原爆ドーム（広島県）・原爆の悲さんさを今に伝える世界遺産', credit: '出典：Wikipedia（パブリックドメイン）' }],
      questions: [

  function wireLesson(L) {
    var sf = stage.querySelector('.score-final');
    var doneBox = stage.querySelector('.done');
    var secretBox = stage.querySelector('.secret');
    var cards = stage.querySelectorAll('.q-card');

    function update() {
      var ans = 0, sc = 0;
      cards.forEach(function (c) { if (c.dataset.done) ans++; if (c.dataset.correct) sc++; });
      stage.querySelector('.score').textContent = sc;
      stage.querySelector('.barFill').style.width = Math.round(ans / cards.length * 100) + '%';
      if (ans === cards.length) {
        markCleared(L.id);
        sf.textContent = sc + ' / ' + cards.length;
        var m;
        if (sc === cards.length) m = '全問正解! でも“1回だけ”じゃもったいない。何も見ずにまたスラスラ解けたら本物。最低5回、完ぺきになるまで基礎練しよう💪';
        else if (sc >= Math.ceil(cards.length * 0.6)) m = 'いい感じ! まちがえた解説をもう一度読んで、もう一周。基礎は最低5回、完ぺきになるまでくり返すのが近道。';
        else m = '大丈夫。解説を読んで、もう一度といてみよう。1回でできる人はいません。くり返すほどできるようになる——まずは最低5回！';
        stage.querySelector('.done-msg').textContent = m;
        doneBox.classList.add('on'); secretBox.classList.add('on');
        doneBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    cards.forEach(function (card) {
      var opts = card.querySelectorAll('.opt');
      opts.forEach(function (b) {
        b.addEventListener('click', function () {
          if (card.dataset.done) return;
          card.dataset.done = '1';
          var ok = b.getAttribute('data-ok') === '1';
          if (ok) card.dataset.correct = '1';
          opts.forEach(function (x) { x.disabled = true; });
          if (ok) { b.classList.add('correct'); }
          else { b.classList.add('wrong'); opts.forEach(function (x) { if (x.getAttribute('data-ok') === '1') x.classList.add('correct'); }); }
          opts.forEach(function (x) { if (!x.classList.contains('correct') && !x.classList.contains('wrong')) x.classList.add('dim'); });
          var src = card.querySelector('.ex-src');
          var ex = document.createElement('div');
          ex.className = 'explain ' + (ok ? 'ok' : 'ng');
          ex.innerHTML = '<span class="verdict">' + (ok ? src.querySelector('.ex-vo').innerHTML : src.querySelector('.ex-vn').innerHTML) + '</span><p>' + src.querySelector('.ex-why').innerHTML + '</p>';
          card.appendChild(ex);
          update();
        });
      });
    });

    var ond = stage.querySelector('.ondoku');
    if (ond) {
      var okey = 'rk_ondoku_' + L.id;
      var obtn = ond.querySelector('.ondoku-btn'), orst = ond.querySelector('.ondoku-reset');
      var odots = ond.querySelectorAll('.ondoku-dots .d'), ocnt = ond.querySelector('.ondoku-count'), opr = ond.querySelector('.ondoku-praise');
      var opaint = function (n) {
        for (var i = 0; i < 5; i++) odots[i].classList.toggle('on', i < n);
        ocnt.textContent = n + '/5'; obtn.disabled = n >= 5;
        if (n >= 3) { opr.hidden = false; opr.textContent = n >= 5 ? '5回、おみごと！もうスラスラだね🏆' : '3回クリア！読む力がついてきてる💪'; }
        else opr.hidden = true;
      };
      obtn.addEventListener('click', function () { var n = lsGet(okey, 0); if (n < 5) { n++; lsSet(okey, n); opaint(n); } });
      orst.addEventListener('click', function () { lsSet(okey, 0); opaint(0); });
    }
    stage.querySelectorAll('[data-go]').forEach(function (el) { el.addEventListener('click', function () { location.hash = el.getAttribute('data-go'); }); });
    var toc = stage.querySelector('[data-toc]'); if (toc) toc.addEventListener('click', function () { location.hash = ''; });
    var retry = stage.querySelector('.retry'); if (retry) retry.addEventListener('click', function () { render(L.id); window.scrollTo(0, 0); });
  }

  function buildReviewPage(R) {
    var h = '<div class="crumbs">ふりかえり<span class="sep">›</span>' + R.crumb + '</div><h1>' + R.title + '</h1>'
      + '<p class="subhead">ここまでの総まとめ。まちがえたら、その話にもどって確認しよう。</p>';
    var hasNarabe = R.order && R.order.length;
    if (hasNarabe) {
      h += '<div class="lesson-head" style="font-size:1.12rem"><span class="num-badge">A</span>年代ならべかえ</div>'
        + '<p class="sec-note">「古い → 新しい」の順に、カードをタップしていこう。</p><div class="narabe">';
      var sh = R.order.map(function (o, i) { return { o: o, i: i }; });
      for (var i = sh.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = sh[i]; sh[i] = sh[j]; sh[j] = t; }
      sh.forEach(function (s) { h += '<button type="button" class="nb" data-idx="' + s.i + '"><span class="nb-order"></span><span class="nb-t">' + s.o.t + '</span></button>'; });
      h += '</div><p class="narabe-msg">いちばん古いものからタップ！</p>';
    }

    h += '<div class="q-head"><span class="num-badge">' + (hasNarabe ? 'B' : '💪') + '</span>一問一答テスト</div>'
      + '<p class="sec-note">' + R.questions.length + '問。まちがえた問題は「→ 第○話」から復習できる。</p>'
      + '<div class="progress"><span>できた</span><span class="count"><span class="score">0</span> / ' + R.questions.length + '</span><span class="bar"><i class="barFill"></i></span></div>';
    R.questions.forEach(function (q, qi) {
      var opts = q.opts.slice();
      for (var k = opts.length - 1; k > 0; k--) { var j2 = Math.floor(Math.random() * (k + 1)); var t2 = opts[k]; opts[k] = opts[j2]; opts[j2] = t2; }
      h += '<div class="q-card"><p class="ask"><span class="qn">問' + (qi + 1) + '</span>' + q.ask + '</p><div class="opts">';
      opts.forEach(function (op, oi) { h += '<button type="button" class="opt" data-ok="' + (op.ok ? '1' : '0') + '"><span class="mk">' + MARKS[oi] + '</span><span>' + op.t + '</span></button>'; });
      h += '</div><div class="ex-src"><span class="ex-vo">' + q.vo + '</span><span class="ex-vn">' + q.vn + '</span><span class="ex-why">' + q.why + ' <a class="backlink" data-go="' + q.backId + '">→ 第' + q.backNo + '話</a></span></div></div>';
    });
    h += '<div class="done"><div class="done-head">' + R.doneHead + '</div><span class="score-final">0 / ' + R.questions.length + '</span><p class="done-msg"></p></div>'
      + '<div class="nav-row"><span></span><button class="nav-btn toc" type="button" data-toc="1">目次へ</button><span></span></div>';
    return h;
  }

  function wireReview1() {
    var box = stage.querySelector('.narabe');
    if (box) {
      var btns = box.querySelectorAll('.nb'), msg = stage.querySelector('.narabe-msg'), next = 0, totalN = btns.length;
      btns.forEach(function (b) {
        b.addEventListener('click', function () {
          if (b.disabled) return;
          var idx = parseInt(b.getAttribute('data-idx'), 10);
          if (idx === next) {
            b.classList.add('ok'); b.disabled = true; b.querySelector('.nb-order').textContent = (next + 1); next++;
            if (next === totalN) { msg.textContent = '完成！ぜんぶ正しい順番に並んだ 🎉'; msg.className = 'narabe-msg done'; }
            else { msg.textContent = 'いいね！次に古いのは?'; msg.className = 'narabe-msg'; }
          } else {
            b.classList.add('ng'); msg.textContent = 'ちがうよ。もっと古いものからえらぼう。'; msg.className = 'narabe-msg bad';
            setTimeout(function () { b.classList.remove('ng'); }, 450);
          }
        });
      });
    }
    var sf = stage.querySelector('.score-final'), doneBox = stage.querySelector('.done'), cards = stage.querySelectorAll('.q-card');
    function update() {
      var ans = 0, sc = 0;
      cards.forEach(function (c) { if (c.dataset.done) ans++; if (c.dataset.correct) sc++; });
      stage.querySelector('.score').textContent = sc;
      stage.querySelector('.barFill').style.width = Math.round(ans / cards.length * 100) + '%';
      if (ans === cards.length) {
        sf.textContent = sc + ' / ' + cards.length;
        var m = sc === cards.length ? '全問正解！バッチリだ🏆' : (sc >= Math.ceil(cards.length * 0.6) ? 'あと少し！まちがえた話にもどって確認しよう。' : '復習が効くところ発見。まちがえた話にもどってみよう。');
        stage.querySelector('.done-msg').textContent = m; doneBox.classList.add('on'); doneBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }
    cards.forEach(function (card) {
      var opts = card.querySelectorAll('.opt');
      opts.forEach(function (b) {
        b.addEventListener('click', function () {
          if (card.dataset.done) return; card.dataset.done = '1';
          var ok = b.getAttribute('data-ok') === '1';
          if (ok) card.dataset.correct = '1';
          opts.forEach(function (x) { x.disabled = true; });
          if (ok) b.classList.add('correct');
          else { b.classList.add('wrong'); opts.forEach(function (x) { if (x.getAttribute('data-ok') === '1') x.classList.add('correct'); }); }
          opts.forEach(function (x) { if (!x.classList.contains('correct') && !x.classList.contains('wrong')) x.classList.add('dim'); });
          var src = card.querySelector('.ex-src');
          var ex = document.createElement('div'); ex.className = 'explain ' + (ok ? 'ok' : 'ng');
          ex.innerHTML = '<span class="verdict">' + (ok ? src.querySelector('.ex-vo').innerHTML : src.querySelector('.ex-vn').innerHTML) + '</span><p>' + src.querySelector('.ex-why').innerHTML + '</p>';
          card.appendChild(ex);
          ex.querySelectorAll('[data-go]').forEach(function (el) { el.addEventListener('click', function () { location.hash = el.getAttribute('data-go'); }); });
          update();
        });
      });
    });
    stage.querySelectorAll('[data-toc]').forEach(function (el) { el.addEventListener('click', function () { location.hash = ''; }); });
  }

  function wireStageNav() {
    stage.querySelectorAll('[data-go]').forEach(function (el) { el.addEventListener('click', function () { location.hash = el.getAttribute('data-go'); }); });
    var t = stage.querySelector('[data-toc]'); if (t) t.addEventListener('click', function () { location.hash = ''; });

    if (id === 'review4') { stage.innerHTML = buildReviewPage(REVIEW4); wireReview1(); stage.hidden = false; home.hidden = true; window.scrollTo(0, 0); return; }
    if (id === 'reviewf') { stage.innerHTML = buildReviewPage(REVIEWF); wireReview1(); stage.hidden = false; home.hidden = true; window.scrollTo(0, 0); return; }
    var L = lessonById(id);
    if (L) {
      stage.innerHTML = buildLessonHTML(L, LESSONS.indexOf(L));
      wireLesson(L);
      stage.hidden = false; home.hidden = true; window.scrollTo(0, 0);
    } else {
      buildHome();
      stage.hidden = true; home.hidden = false; window.scrollTo(0, 0);
    }
  }
